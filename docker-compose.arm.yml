version: '3'

services:
  api:
    image: ghcr.io/elgazzar/bkam-api:arm64
    pull_policy: always
    container_name: bkam-api
    restart: always
    ports:
      - "3001:3001"
    volumes:
      # Persistent cache directories so flat-cache and history store survive container redeployments
      - /home/ubuntu/egp-api/var:/app/var
      - /home/ubuntu/egp-api/cache:/app/.cache
    environment:
      - PORT=3001
      - DB_USER=m7moudelgazzar
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_HOST=bkam_db
      - DB_PORT=5432
      - DB_NAME=bkam_db
      - DB_SSLMODE=disable
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app-net

networks:
  app-net:
    external: true
    name: app-net
