name: Deploy API

# -----------------------------------------------------------------------------
# BKAM API DEPLOYMENT WORKFLOW
# Builds and pushes the API Docker image to GitHub Container Registry.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push latest Docker image to GitHub Container Registry
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/elgazzar/bkam-api:latest

      # Deploy to Portainer via stack webhook
      - name: Deploy to Portainer
        run: |
          echo "🚀 Triggering Portainer stack redeployment webhook..."
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          echo "✅ Portainer stack webhook successfully triggered. Deployment initiated."


