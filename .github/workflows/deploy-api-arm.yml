name: Deploy API (ARM64)

# -----------------------------------------------------------------------------
# BKAM API DEPLOYMENT WORKFLOW (ARM64 / OCI Ampere A1)
# Native linux/arm64 build using GitHub's native ARM64 runner.
# -----------------------------------------------------------------------------

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push-arm:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ARM64 Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/elgazzar/bkam-api:arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy to Portainer via stack webhook
      - name: Deploy to Portainer
        run: |
          echo "🚀 Triggering Portainer stack redeployment webhook..."
          curl -fsS -X POST "${{ secrets.PORTAINER_WEBHOOK_URL }}"
          echo "✅ Portainer stack webhook successfully triggered. Deployment initiated."


